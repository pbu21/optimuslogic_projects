<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>GPS Tracker</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
html, body {
    height: 100%;
    margin: 0;
}

#map {
    height: 100vh;
    width: 100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<script>

var map = L.map('map').setView([12.9123, 77.6123], 13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    maxZoom: 19
}).addTo(map);

var marker =
L.marker([12.9123,77.6123]).addTo(map);

console.log("Map Loaded");

const client =
mqtt.connect('ws://127.0.0.1:9001');

client.on('connect', function()
{
    console.log("MQTT Connected");
    client.subscribe('gps/stack');
});

client.on('message', function(topic, message)
{
    let txt = message.toString();

    console.log("Received:", txt);

    try
    {
        txt = txt.replace("{lat:","{\"lat\":");
        txt = txt.replace(",lon:"," ,\"lon\":");

        let data = JSON.parse(txt);

        marker.setLatLng([data.lat,data.lon]);

        map.panTo([data.lat,data.lon]);

        console.log("GPS Updated");
    }
    catch(e)
    {
        console.log("JSON Error", e);
    }
});

</script>

</body>
</html>
